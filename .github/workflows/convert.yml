name: Convert TXT to MRS

on:
  push:
    paths:
      - 'OKTV.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mihomo
        run: |
          # 稳定下载 v1.18.3
          curl -L -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gunzip -f mihomo.gz
          mv mihomo-linux-amd64-v1.18.3 mihomo_tool
          chmod +x mihomo_tool

      - name: Prepare and Compile
        run: |
          # 1. 预处理 OKTV.txt
          # 清除可能存在的 Windows 换行符 (\r)，并删除空行和首尾空格
          grep -v '^$' OKTV.txt | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > cleaned.txt
          
          # 2. 构造 YAML (检测是否已经包含 payload)
          if grep -q "payload:" cleaned.txt; then
            cp cleaned.txt temp_rules.yaml
          else
            echo "payload:" > temp_rules.yaml
            sed 's/^/  - /' cleaned.txt >> temp_rules.yaml
          fi
          
          # 3. 调试输出：在日志中打印前 5 行，方便排查格式
          echo "--- Generated YAML Header ---"
          head -n 5 temp_rules.yaml
          echo "-----------------------------"
          
          # 4. 执行编译并捕获详细错误
          if ! ./mihomo_tool rule-set compile temp_rules.yaml OKTV.mrs; then
            echo "Error: Mihomo compiler failed."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 确保文件存在且不为空
          if [ -s "OKTV.mrs" ]; then
            git add OKTV.mrs
            if git diff --staged --quiet; then
              echo "No changes in MRS file."
            else
              git commit -m "Auto-update OKTV.mrs [skip ci]"
              git push
            fi
          else
            echo "Error: OKTV.mrs is empty or not found."
            exit 1
          fi
