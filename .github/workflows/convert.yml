name: Convert TXT to MRS

on:
  push:
    paths:
      - 'oktv.txt' # 仅当 oktv.txt 修改时触发
  workflow_dispatch: # 允许手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget

      - name: Download Mihomo Tool
        run: |
          # 下载最新版 mihomo 核心
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gunzip mihomo-linux-amd64-v1.18.3.gz
          mv mihomo-linux-amd64-v1.18.3 mihomo
          chmod +x mihomo

      - name: Prepare YAML Payload
        run: |
          # 将 +.domain.com 转换为 DOMAIN-SUFFIX,domain.com 格式
          echo "payload:" > temp_rules.yaml
          sed 's/^+.\(.*\)/  - DOMAIN-SUFFIX,\1/' oktv.txt >> temp_rules.yaml

      - name: Compile MRS
        run: |
          # 使用 mihomo 编译为 mrs 格式
          ./mihomo rule-set compile temp_rules.yaml OKTV.mrs

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add OKTV.mrs
          # 只有在文件有变动时才提交，防止报错
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update OKTV.mrs"
          git push
