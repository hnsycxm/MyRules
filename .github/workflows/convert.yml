name: Test TXT to MRS (极简版)
on:
  workflow_dispatch:  # 仅手动触发，避免自动执行干扰

permissions:
  contents: write

jobs:
  test_convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装固定版本mihomo（100%可下载）
        run: |
          # 直接用固定版本，避免API/链接问题
          echo "安装mihomo v1.18.1（已知稳定版）"
          curl -L "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.1/mihomo-linux-amd64-1.18.1.gz" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          # 打印版本，确认安装成功
          mihomo --version || echo "版本检测忽略（部分版本无该命令）"

      - name: 转换根目录的test.txt（仅测试单个文件）
        run: |
          # 先检查test.txt是否存在
          if [ ! -f "test.txt" ]; then
            echo "❌ 根目录没有test.txt文件！请先在仓库根目录新建test.txt"
            exit 1
          fi
          echo "开始转换test.txt..."
          # 极简清洗规则（只保留纯域名）
          grep -v '\[source' test.txt | sed 's/^+.\?//g' | sed '/^$/d' > temp.txt
          # 编译为test.mrs
          mihomo rule-set compile temp.txt test.mrs
          # 检查是否生成mrs文件
          if [ -f "test.mrs" ]; then
            echo "✅ 成功生成test.mrs文件！"
            ls -l test.mrs  # 打印文件信息
          else
            echo "❌ 未生成test.mrs文件"
            exit 1
          fi
          rm temp.txt  # 清理临时文件

      # 暂时注释提交步骤，先确认生成文件成功
