name: Convert TXT to MRS
on:
  push:
    paths:
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  convert_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Mihomo (无需gh cli)
        run: |
          set -euo pipefail
          
          # 方案1：直接通过GitHub API获取最新release的tag（无需gh cli，无需认证）
          echo "📥 正在获取mihomo最新版本信息..."
          TAG=$(curl -sL --retry 3 --connect-timeout 10 \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          
          # 兜底：如果API访问失败，使用固定版本（避免流程中断）
          if [ -z "$TAG" ]; then
            echo "⚠️ 获取最新版本失败，使用备用版本 v1.18.1"
            TAG="v1.18.1"
          fi
          
          # 修复下载链接格式（适配mihomo的release命名规则）
          # 移除tag前的v（如果有），拼接正确的文件名
          CLEAN_TAG=${TAG#v}
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-${CLEAN_TAG}.gz"
          echo "🔗 下载链接: $URL"
          
          # 下载并解压
          curl -L --retry 3 --connect-timeout 10 "$URL" -o mihomo.gz
          if [ $? -ne 0 ]; then
            echo "❌ 下载失败，尝试兼容格式: https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64.gz"
            curl -L --retry 3 --connect-timeout 10 "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64.gz" -o mihomo.gz
          fi
          
          # 解压并安装
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          
          # 验证安装
          if ! mihomo --version; then
            echo "❌ mihomo安装失败"
            exit 1
          fi
          echo "✅ mihomo安装成功，版本: $(mihomo --version | head -n1)"

      - name: Convert All TXT to MRS
        run: |
          set -euo pipefail
          # 遍历所有目录下的txt文件
          find . -type f -name "*.txt" | while read -r file; do
            if [ ! -f "$file" ]; then
              continue
            fi
            filename="${file%.txt}"
            echo "🔄 正在处理文件: $file"
            
            # 强力清洗规则
            temp_file="${filename}.temp_rule.txt"
            grep -v '\[source' "$file" | \
              sed 's/^+[.]\?//g' | \
              sed '/^[[:space:]]*$/d' | \
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > "$temp_file"
            
            # 检查临时文件是否为空
            if [ ! -s "$temp_file" ]; then
              echo "⚠️ 清洗后文件为空，跳过: $file"
              rm -f "$temp_file"
              continue
            fi
            
            # 执行编译
            if mihomo rule-set compile "$temp_file" "${filename}.mrs"; then
              echo "✅ 成功转换: ${filename}.mrs"
            else
              echo "❌ 转换失败: $file"
              rm -f "$temp_file"
              continue
            fi
            rm -f "$temp_file"
          done

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查所有mrs文件变动
          if [ -n "$(git status --porcelain | grep '\.mrs')" ]; then
            git add '*.mrs' **/*.mrs
            git commit -m "自动更新规则集: $(date +'%Y-%m-%d %H:%M:%S')"
            # 推送重试机制
            git push || (sleep 5 && git push)
          else
            echo "ℹ️ 没有发现 MRS 文件变动，跳过提交。"
          fi
