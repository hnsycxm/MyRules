"on":
  push:
    paths:
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mihomo
        run: |
          # 使用 GitHub CLI 获取下载地址，避免 API 频率限制报错
          TAG=$(gh release view --repo MetaCubeX/mihomo --json tagName --template '{{.tagName}}')
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-${TAG}.gz"
          echo "正在下载: $URL"
          curl -L "$URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Convert All TXT to MRS
        run: |
          for file in *.txt; do
            if [ -f "$file" ]; then
              filename="${file%.*}"
              echo "正在处理: $file"
              
              # 修改前：只删除了 +.
              # 修改后：增加强力清洗，剔除 等杂质，只保留纯域名格式
              grep -v '\[source' "$file" | sed 's/^+.\?//g' | sed '/^$/d' > temp_rule.txt
              
              # 执行编译
              if mihomo rule-set compile temp_rule.txt "${filename}.mrs"; then
                echo "✅ 成功转换: ${filename}.mrs"
              else
                echo "❌ 转换失败: $file"
                exit 1
              fi
              rm temp_rule.txt
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain *.mrs)" ]; then
            git add *.mrs
            git commit -m "自动更新规则集: $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "没有发现 MRS 文件变动，跳过提交。"
          fi
