name: Convert TXT to MRS

on:
  push:
    paths:
      - 'OKTV.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mihomo
        run: |
          # 修复点：直接解压并重命名，不再使用 mv 查找不确定的文件名
          curl -L https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz | gunzip > mihomo_tool
          chmod +x mihomo_tool
          ./mihomo_tool -v # 验证工具是否正常工作

      - name: Smart Format and Compile
        run: |
          # 1. 清洗数据：清除回车符、首尾空格、空行
          tr -d '\r' < OKTV.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > cleaned.txt
          
          # 2. 构造 YAML 格式
          echo "payload:" > temp_rules.yaml
          while IFS= read -r line; do
            # 如果行内不包含逗号，自动补全为 DOMAIN 类型
            if [[ "$line" != *","* ]]; then
              echo "  - DOMAIN,$line" >> temp_rules.yaml
            else
              echo "  - $line" >> temp_rules.yaml
            fi
          done < cleaned.txt
          
          # 3. 调试：打印生成的 YAML 前几行到日志
          echo "--- Generated YAML Preview ---"
          head -n 10 temp_rules.yaml
          echo "------------------------------"
          
          # 4. 执行编译
          ./mihomo_tool rule-set compile temp_rules.yaml OKTV.mrs

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查文件是否生成且有内容
          if [ -s "OKTV.mrs" ]; then
            git add OKTV.mrs
            if git diff --staged --quiet; then
              echo "No changes in MRS file."
            else
              git commit -m "Auto-update OKTV.mrs [skip ci]"
              git push
            fi
          else
            echo "Error: OKTV.mrs generation failed."
            exit 1
          fi
