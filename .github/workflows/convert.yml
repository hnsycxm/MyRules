name: Convert TXT to MRS

on:
  push:
    paths:
      - 'OKTV.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mihomo
        run: |
          # 下载官方稳定版 (v1.18.3)
          curl -L -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gunzip mihomo.gz
          mv mihomo-linux-amd64-v1.18.3 mihomo_tool
          chmod +x mihomo_tool
          ./mihomo_tool -v # 验证版本，确保下载成功

      - name: Prepare and Compile
        run: |
          # 1. 构造标准的 YAML 格式
          # 先创建头部
          echo "payload:" > temp_rules.yaml
          
          # 2. 处理 OKTV.txt：去除空行、首尾空格，并添加 YAML 列表符号
          # 使用 grep 过滤掉空行，用 sed 给每行开头增加 "  - "
          grep -v '^$' OKTV.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/^/  - /' >> temp_rules.yaml
          
          # 3. 强制执行编译转换命令 (使用绝对路径和明确的子命令)
          ./mihomo_tool rule-set compile temp_rules.yaml OKTV.mrs
          
          # 4. 验证文件是否生成
          if [ -f "OKTV.mrs" ]; then
            echo "Success: OKTV.mrs generated."
          else
            echo "Error: OKTV.mrs was not created."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 仅在文件有变化时提交
          git add OKTV.mrs
          if git diff --staged --quiet; then
            echo "No changes in MRS file."
          else
            git commit -m "Auto-update OKTV.mrs [skip ci]"
            git push
          fi
