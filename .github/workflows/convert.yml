name: Auto Convert TXT to MRS
on:
  push:
    paths:
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  convert_txt_to_mrs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Docker Environment
        run: |
          set -e
          echo "🔍 检查Docker版本..."
          docker --version
          echo "📥 拉取metacubex/mihomo:latest镜像..."
          docker pull metacubex/mihomo:latest
          echo "✅ Docker环境和镜像准备完成"

      - name: Convert All TXT Files to MRS
        run: |
          set -e
          total_files=0
          success_files=0
          failed_files=0

          echo "🔄 开始遍历所有TXT文件..."
          find . -type f -name "*.txt" -not -path "./.git/*" | while read -r txt_file; do
            total_files=$((total_files + 1))
            mrs_file="${txt_file%.txt}.mrs"
            temp_file="${txt_file%.txt}.temp.txt"

            echo -e "\n========== 处理文件：$txt_file =========="
            # 清洗TXT文件
            grep -v -E '^\s*$|\[source|#|//|;' "$txt_file" | \
              sed 's/^[+./| \t]*//g' | \
              sed 's/[| \t].*$//g' > "$temp_file"

            # 检查空文件
            if [ ! -s "$temp_file" ]; then
              echo "⚠️ 清洗后文件为空，跳过：$txt_file"
              rm -f "$temp_file"
              continue
            fi

            # 修复后的Docker编译命令
            echo "📝 编译为MRS文件：$mrs_file"
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              --entrypoint /app/mihomo \
              metacubex/mihomo:latest \
              rule-set compile "$temp_file" "$mrs_file"

            # 验证生成结果
            if [ -f "$mrs_file" ]; then
              echo "✅ 转换成功：$mrs_file"
              success_files=$((success_files + 1))
              rm -f "$temp_file"
            else
              echo "❌ 转换失败：$txt_file"
              failed_files=$((failed_files + 1))
              rm -f "$temp_file"
            fi
          done

          # 统计输出
          echo -e "\n📊 转换统计结果："
          echo "总TXT文件数：$total_files"
          echo "成功转换：$success_files"
          echo "转换失败：$failed_files"

      - name: Commit and Push MRS Files
        run: |
          set -e
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mrs_changes=$(git status --porcelain | grep '\.mrs' || true)
          if [ -n "$mrs_changes" ]; then
            echo "🔖 发现MRS文件变动，开始提交..."
            git add '*.mrs' **/*.mrs
            git commit -m "Auto convert TXT to MRS: $(date +'%Y-%m-%d %H:%M:%S')"
            # 推送重试
            for i in 1 2 3; do
              if git push; then
                echo "✅ MRS文件提交成功！"
                break
              else
                echo "⚠️ 推送失败，第$i次重试..."
                sleep 3
              fi
            done
          else
            echo "ℹ️ 无MRS文件变动，跳过提交"
          fi
