# 工作流名称：TXT文件自动转换为MRS二进制文件
name: Auto Convert TXT to MRS
# 触发条件：推送txt文件 或 手动触发
on:
  push:
    paths:
      - '**.txt'  # 匹配仓库中所有目录的txt文件
  workflow_dispatch:  # 手动触发按钮（Actions页面可见）

# 权限配置：允许写入仓库内容（提交MRS文件）
permissions:
  contents: write
  packages: read  # 可选：拉取Docker镜像可能需要

jobs:
  # 核心任务：转换TXT到MRS
  convert_txt_to_mrs:
    runs-on: ubuntu-latest  # 基于Ubuntu最新版运行
    steps:
      # 步骤1：检出仓库代码（必须，否则无法访问txt文件）
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整仓库历史，避免提交时分支异常

      # 步骤2：检查Docker环境并预拉取官方镜像（核心修复）
      - name: Prepare Docker Environment
        run: |
          set -e  # 命令失败则立即退出
          # 验证Docker是否可用
          echo "🔍 检查Docker版本..."
          docker --version
          # 预拉取MetaCubeX官方mihomo镜像（避免运行时才拉取导致格式错误）
          echo "📥 拉取metacubex/mihomo:latest镜像..."
          docker pull metacubex/mihomo:latest
          echo "✅ Docker环境和镜像准备完成"

      # 步骤3：遍历所有TXT文件并转换（支持多文件/子目录）
      - name: Convert All TXT Files to MRS
        run: |
          set -e
          # 统计变量
          total_files=0
          success_files=0
          failed_files=0

          echo "🔄 开始遍历所有TXT文件..."
          # 遍历所有txt文件（排除.git目录）
          find . -type f -name "*.txt" -not -path "./.git/*" | while read -r txt_file; do
            total_files=$((total_files + 1))
            # 生成对应的MRS文件名（替换后缀，保留目录结构）
            mrs_file="${txt_file%.txt}.mrs"
            # 生成唯一临时文件（避免多文件冲突）
            temp_file="${txt_file%.txt}.temp.txt"

            echo -e "\n========== 处理文件：$txt_file =========="
            # 步骤3.1：清洗TXT文件（只保留纯域名，剔除杂质）
            grep -v -E '^\s*$|\[source|#|//|;' "$txt_file" | \
              sed 's/^[+./| \t]*//g' | \
              sed 's/[| \t].*$//g' > "$temp_file"

            # 步骤3.2：检查清洗后的文件是否为空
            if [ ! -s "$temp_file" ]; then
              echo "⚠️ 清洗后文件为空，跳过：$txt_file"
              rm -f "$temp_file"
              continue
            fi

            # 步骤3.3：Docker执行编译（单行命令，无格式错误）
            echo "📝 编译为MRS文件：$mrs_file"
            docker run --rm -v "$PWD:/workspace" -w /workspace metacubex/mihomo:latest \
              rule-set compile "$temp_file" "$mrs_file"

            # 步骤3.4：验证MRS文件是否生成
            if [ -f "$mrs_file" ]; then
              echo "✅ 转换成功：$mrs_file"
              success_files=$((success_files + 1))
              # 清理临时文件
              rm -f "$temp_file"
            else
              echo "❌ 转换失败：$txt_file"
              failed_files=$((failed_files + 1))
              rm -f "$temp_file"
            fi
          done

          # 输出转换统计
          echo -e "\n📊 转换统计结果："
          echo "总TXT文件数：$total_files"
          echo "成功转换：$success_files"
          echo "转换失败：$failed_files"

          # 可选：如果有失败则退出（根据需求开启/关闭）
          # if [ $failed_files -gt 0 ]; then
          #   echo "❌ 存在转换失败的文件，任务终止"
          #   exit 1
          # fi

      # 步骤4：提交MRS文件到仓库
      - name: Commit and Push MRS Files
        run: |
          set -e
          # 配置Git用户信息（必须，否则提交失败）
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 检查是否有MRS文件变动
          mrs_changes=$(git status --porcelain | grep '\.mrs' || true)
          if [ -n "$mrs_changes" ]; then
            echo "🔖 发现MRS文件变动，开始提交..."
            # 添加所有MRS文件（包括子目录）
            git add '*.mrs' **/*.mrs
            # 提交信息（带时间戳）
            git commit -m "Auto convert TXT to MRS: $(date +'%Y-%m-%d %H:%M:%S')"
            # 推送（重试2次，避免网络波动）
            for i in 1 2 3; do
              if git push; then
                echo "✅ MRS文件提交成功！"
                break
              else
                echo "⚠️ 推送失败，第$i次重试..."
                sleep 3
              fi
            done
          else
            echo "ℹ️ 无MRS文件变动，跳过提交"
          fi
