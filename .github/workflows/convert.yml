name: Auto Convert TXT to MRS (极简不超时版)
on:
  workflow_dispatch:  # 仅手动触发，避免自动超时
  push:
    paths:
      - '**.txt'

permissions:
  contents: write

jobs:
  convert_txt_to_mrs:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 缩短超时时间，避免无谓等待
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 直接转换TXT到MRS（核心：强制退出）
        run: |
          set -e
          # 只处理根目录test.txt（先跑通核心功能）
          TXT_FILE="./test.txt"
          MRS_FILE="./test.mrs"
          TEMP_FILE="./temp.txt"

          # 1. 检查test.txt存在
          if [ ! -f "$TXT_FILE" ]; then
            echo "❌ 请在根目录新建test.txt，内容仅保留纯域名（如baidu.com）"
            exit 1
          fi

          # 2. 清洗TXT（只保留纯域名）
          grep -v -E '^\s*$|\[source|#|//|;' "$TXT_FILE" | \
            sed 's/^[+./| \t]*//g' > "$TEMP_FILE"

          if [ ! -s "$TEMP_FILE" ]; then
            echo "⚠️ 清洗后文件为空，终止"
            exit 1
          fi

          # 3. 核心修复：执行编译并强制容器退出（不启动代理）
          echo "📝 编译test.txt → test.mrs"
          # 关键：用sh -c包裹命令，执行编译后立即kill mihomo进程
          docker run --rm --init -v "$PWD:/workspace" -w /workspace metacubex/mihomo:latest \
            sh -c "mihomo rule-set compile $TEMP_FILE $MRS_FILE && killall mihomo"

          # 4. 验证生成结果
          if [ -f "$MRS_FILE" ]; then
            echo "✅ 转换成功！生成test.mrs"
            ls -lh "$MRS_FILE"
            rm -f "$TEMP_FILE"
          else
            echo "❌ 转换失败"
            exit 1
          fi

      - name: 提交test.mrs到仓库
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f "test.mrs" ]; then
            git add test.mrs
            git commit -m "生成test.mrs $(date +'%Y-%m-%d')"
            git push
            echo "✅ 提交成功"
          fi
