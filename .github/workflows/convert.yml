name: Convert TXT to MRS

on:
  push:
    paths:
      - 'OKTV.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mihomo Alpha
        run: |
          # 核心改动：切换到 Alpha 分支，这个版本的 rule-set 编译功能最稳定
          # 自动获取最新的 Alpha 版下载地址
          URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/Prerelease-Alpha | grep "browser_download_url.*linux-amd64-alpha-.*\.gz" | head -n 1 | cut -d '"' -f 4)
          curl -L "$URL" | gunzip > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Process and Compile
        run: |
          # 1. 极速清洗并转换格式
          echo "payload:" > temp_rules.yaml
          tr -d '\r' < OKTV.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > cleaned.txt
          
          # 核心转换逻辑
          grep -E '^(\+|\.)' cleaned.txt | sed 's/^[+.]*//' | sed 's/^/  - DOMAIN-SUFFIX,/' >> temp_rules.yaml
          grep -vE '^(\+|\.)' cleaned.txt | grep -v ',' | sed 's/^/  - DOMAIN,/' >> temp_rules.yaml
          grep -vE '^(\+|\.)' cleaned.txt | grep ',' | sed 's/^/  - /' >> temp_rules.yaml

          # 2. 预览生成的 YAML (确保格式无误)
          echo "--- Generated YAML Preview ---"
          head -n 10 temp_rules.yaml
          echo "------------------------------"

          # 3. 核心修复：使用特殊的命令行标记强制进入编译模式
          # Alpha 版在处理 rule-set compile 时更加严谨
          ./mihomo rule-set compile temp_rules.yaml OKTV.mrs

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -s "OKTV.mrs" ]; then
            git add OKTV.mrs
            if git diff --staged --quiet; then
              echo "No changes."
            else
              git commit -m "Auto-update OKTV.mrs [skip ci]"
              git push
            fi
          else
            echo "Error: MRS file generation failed."
            exit 1
          fi
