name: Test TXT to MRS (极简版)
on:
  workflow_dispatch:  # 仅手动触发

permissions:
  contents: write

jobs:
  test_convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装mihomo（直接下载二进制，跳过解压）
        run: |
          set -e
          echo "✅ 开始下载mihomo二进制文件（有效源）"
          # 替换为MetaCubeX官方可用的二进制源（无需解压）
          curl -L --retry 3 \
            "https://github.com/MetaCubeX/mihomo-nightly/releases/latest/download/mihomo-linux-amd64" \
            -o mihomo
          
          # 校验文件是否下载成功（大小>0）
          if [ ! -s "mihomo" ]; then
            echo "❌ 下载失败，文件为空"
            exit 1
          fi
          
          # 赋予执行权限并安装到系统目录
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/
          
          # 验证安装（兼容不同版本输出）
          if mihomo version >/dev/null 2>&1; then
            echo "✅ mihomo安装成功，版本：$(mihomo version | head -n1)"
          elif mihomo --version >/dev/null 2>&1; then
            echo "✅ mihomo安装成功，版本：$(mihomo --version | head -n1)"
          else
            echo "⚠️ 版本检测忽略，但文件已安装（可正常使用）"
          fi

      - name: 转换根目录的test.txt
        run: |
          set -e
          # 检查test.txt是否存在
          if [ ! -f "test.txt" ]; then
            echo "❌ 根目录未找到test.txt！请先新建，内容只写纯域名（如baidu.com）"
            exit 1
          fi
          echo "✅ 开始转换test.txt"
          
          # 极简清洗：只保留纯域名，剔除无关内容
          grep -v -E '^\s*$|\[source|#' test.txt | sed 's/^[+./]*//g' > temp.txt
          
          # 编译为mrs文件
          if mihomo rule-set compile temp.txt test.mrs; then
            echo "✅ 转换成功！生成test.mrs文件"
            ls -l test.mrs  # 打印文件信息
          else
            echo "❌ 转换失败！请检查test.txt内容是否为纯域名（无特殊字符/注释）"
            exit 1
          fi
          
          # 清理临时文件
          rm -f temp.txt

      # 可选：确认转换成功后，取消注释开启提交
      # - name: 提交test.mrs到仓库
      #   run: |
      #     git config --local user.name "github-actions[bot]"
      #     git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #     git add test.mrs
      #     git commit -m "测试生成test.mrs $(date +'%Y-%m-%d')"
      #     git push
