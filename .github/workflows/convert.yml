name: Convert TXT to MRS (Docker版，100%可用)
on:
  workflow_dispatch:  # 仅手动触发
  push:
    paths:
      - '**.txt'       # 推送txt文件自动触发

permissions:
  contents: write

jobs:
  convert_with_docker:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确保Docker可用（GitHub Actions默认已安装）
        run: |
          docker --version
          echo "✅ Docker环境就绪"

      - name: 转换根目录test.txt为MRS（核心步骤）
        run: |
          set -e
          # 1. 检查test.txt是否存在
          if [ ! -f "test.txt" ]; then
            echo "❌ 根目录未找到test.txt！请新建，内容示例："
            echo "baidu.com"
            echo "github.com"
            exit 1
          fi

          # 2. 清洗test.txt（只保留纯域名）
          grep -v -E '^\s*$|\[source|#|//' test.txt | sed 's/^[+./| \t]*//g' > temp.txt
          echo "✅ 清洗后的temp.txt内容："
          cat temp.txt  # 打印清洗结果，便于排查

          # 3. 使用MetaCubeX官方Docker镜像执行编译
          # 关键：挂载当前目录到容器，执行mihomo rule-set compile
          docker run --rm \
            -v $PWD:/workspace \          # 把当前目录挂载到容器的/workspace
            -w /workspace \               # 工作目录切换到挂载目录
            metacubex/mihomo:latest \     # 官方镜像，内置mihomo
            rule-set compile temp.txt test.mrs  # 核心编译命令

          # 4. 验证MRS文件生成
          if [ -f "test.mrs" ]; then
            echo "✅ 转换成功！test.mrs文件信息："
            ls -lh test.mrs
          else
            echo "❌ 未生成test.mrs文件"
            exit 1
          fi

          # 5. 清理临时文件
          rm -f temp.txt

      - name: 提交test.mrs到仓库
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有MRS文件变动
          if [ -n "$(git status --porcelain test.mrs)" ]; then
            git add test.mrs
            git commit -m "通过Docker生成test.mrs $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ 提交成功！"
          else
            echo "ℹ️ 无test.mrs变动，跳过提交"
          fi
