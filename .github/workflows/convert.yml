"on": # 使用引号包裹关键词，防止解析器错误识别
  push:
    paths:
      - '**.txt' # 监听仓库内所有 .txt 文件的变动
  workflow_dispatch: # 支持手动运行

permissions:
  contents: write # 必须：授予 Action 推送代码到仓库的权限

jobs:
  convert_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以确保能正确提交

      - name: Install Mihomo
        run: |
          # 获取最新版 Mihomo 下载链接
          URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url.*linux-amd64-v" | cut -d '"' -f 4 | head -n 1)
          curl -L $URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Convert All TXT to MRS
        run: |
          # 遍历仓库中所有的 .txt 文件并进行转换
          for file in *.txt; do
            if [ -f "$file" ]; then
              filename="${file%.*}"
              echo "正在转换: $file -> ${filename}.mrs"
              
              # 预处理：移除 +. 前缀（适配 OpenClash 纯域名规则集要求）
              sed 's/^+.\?//g' "$file" > temp_rule.txt
              
              # 编译为二进制 mrs
              mihomo rule-set compile temp_rule.txt "${filename}.mrs"
              
              rm temp_rule.txt
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查是否有文件变动，避免空提交报错
          if [ -n "$(git status --porcelain)" ]; then
            git add *.mrs
            git commit -m "Auto-update MRS rules: $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "没有发现 mrs 文件更新，跳过提交。"
          fi
