name: Convert TXT to MRS

on:
  push:
    paths:
      - 'OKTV.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mihomo
        run: |
          # 使用直接重定向解压，确保文件名固定
          curl -L https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz | gunzip > mihomo_tool
          chmod +x mihomo_tool

      - name: Smart Format and Compile
        run: |
          # 1. 预处理数据
          # 清除回车符、首尾空格、空行
          tr -d '\r' < OKTV.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > cleaned.txt
          
          # 2. 核心转换逻辑：将 +.domain.com 转为 DOMAIN-SUFFIX,domain.com
          echo "payload:" > temp_rules.yaml
          while IFS= read -r line; do
            if [[ "$line" == "+."* ]]; then
              # 处理带 +. 的域名
              echo "  - DOMAIN-SUFFIX,${line#+.}" >> temp_rules.yaml
            elif [[ "$line" != *","* ]]; then
              # 处理纯域名
              echo "  - DOMAIN,$line" >> temp_rules.yaml
            else
              # 处理已经有类型的规则
              echo "  - $line" >> temp_rules.yaml
            fi
          done < cleaned.txt
          
          # 3. 打印预览用于调试
          echo "--- Final YAML Preview (Top 15 lines) ---"
          head -n 15 temp_rules.yaml
          echo "----------------------------------------"
          
          # 4. 执行编译 (使用 timeout 确保如果不小心进入代理模式也能自动结束)
          # 注意：rule-set compile 是独立工具命令，不需要启动内核环境
          timeout 30s ./mihomo_tool rule-set compile temp_rules.yaml OKTV.mrs
          
          # 5. 最终验证
          if [ -s "OKTV.mrs" ]; then
            echo "Success: OKTV.mrs has been generated."
          else
            echo "Error: Output file is empty or failed to compile."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "OKTV.mrs" ]; then
            git add OKTV.mrs
            if git diff --staged --quiet; then
              echo "No changes in MRS."
            else
              git commit -m "Auto-update OKTV.mrs [skip ci]"
              git push
            fi
          fi
