name: Auto Update Rules
on:
  push:
    paths:
      - [cite_start]'txt/**' [cite: 1]
    [cite_start]branches: [ main ] [cite: 1]
  schedule:
    - [cite_start]cron: '0 0 * * *' [cite: 1]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason'
        default: 'Manual trigger'

env:
  [cite_start]TZ: Asia/Shanghai [cite: 1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      [cite_start]contents: write [cite: 1]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Get Mihomo Version
        id: get_version
        run: |
          version=$(curl -sL https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/version.txt)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Mihomo Tool
        id: cache-mihomo
        uses: actions/cache@v3
        with:
          # 修复点：使用通配符确保匹配到下载的文件
          path: script/mihomo-*
          key: mihomo-${{ steps.get_version.outputs.version }}

      - name: Build Rules
        run: bash ./script/build-combined-rules.sh

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 CI: Updated Rules (${{ steps.get_version.outputs.version }})"
          file_pattern: "*.mrs"
