name: Auto Update Rules
on:
  push:
    paths:
      - 'txt/**'
    branches: [ main ]
  schedule:
    # 每天北京时间上午 8:00 运行 (UTC 时间 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason for manual run'
        required: false
        default: 'Manual trigger'
        type: string

env:
  TZ: Asia/Shanghai

# 防止并发运行互相冲突
concurrency:
  group: auto-update-rules
  cancel-in-progress: true

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 检出仓库代码
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      # 安装 Python 依赖（仅构建所需）
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 1. 获取 Mihomo 最新版本号
      - name: Get Mihomo Version
        id: get-version
        run: |
          VERSION=$(curl -s --retry 3 --max-time 30 https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | python -c "import sys, json; d = json.load(sys.stdin); print(d.get('tag_name', ''))" 2>/dev/null || true)
          if [ -z "$VERSION" ]; then VERSION="v1.18.10"; fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # 2. 缓存 Mihomo CLI
      - name: Cache Mihomo CLI
        id: cache-mihomo
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/mihomo
          key: mihomo-bin-${{ steps.get-version.outputs.version }}

      # 3. 安装 Mihomo CLI（无缓存时执行）
      - name: Setup Mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          echo "Downloading Mihomo Version: ${VERSION}"
          
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz"
          if ! curl -sSL -f "$DOWNLOAD_URL" -o mihomo.gz; then
            DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"
            curl -sSL -f "$DOWNLOAD_URL" -o mihomo.gz
          fi

          gzip -d -f mihomo.gz
          mv mihomo /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo

      # 4. 验证 Mihomo 是否就绪
      - name: Verify Mihomo
        run: |
          chmod +x /usr/local/bin/mihomo || true
          mihomo -v

      # 5. 执行项目逻辑脚本进行编译
      #    STRICT_UNKNOWN=1：任何无法识别的规则类型都视为失败（当前 5 份清单已核验均为 0）
      #    --prune：全部构建成功后删除 mrs/ 中已无对应 txt 源的过期 .mrs
      - name: Build Rules
        run: |
          chmod +x ./script/build-combined-rules.sh
          STRICT_UNKNOWN=1 ./script/build-combined-rules.sh --prune

      # 6. 检测到文件改动时自动提交并推送
      #    txt/ 是只读输入，构建从不修改它；git add -A mrs/ 同时暂存新增、修改与
      #    --prune 删掉的过期产物（txt/*.txt 是冗余且会掩盖问题，已移除）。
      #    注意：这里用默认的 GITHUB_TOKEN，其 push 不会触发新的 workflow；
      #    若换成 PAT 会形成自触发循环，需另行加防护。
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A mrs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): auto convert txt files to mrs rulesets in /mrs dir" --signoff
            git push
          fi
