name: Auto Update Rules
on:
  push:
    paths:
      - 'txt/**'
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 8:00
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason'
        default: 'Manual trigger'

env:
  TZ: Asia/Shanghai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Get Mihomo Version
        id: get_version
        run: |
          version=$(curl -sL https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/version.txt)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Mihomo Tool
        id: cache-mihomo
        uses: actions/cache@v3
        with:
          path: script/mihomo-linux-amd64-${{ steps.get_version.outputs.version }}
          key: mihomo-${{ steps.get_version.outputs.version }}

      - name: Build Rules
        run: bash ./script/build-combined-rules.sh

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 CI: Updated Rules (${{ steps.get_version.outputs.version }})"
          file_pattern: "*.mrs"
