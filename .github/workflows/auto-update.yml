name: Auto Update Rules
on:
  push:
    paths:
      - 'txt/**'
    branches: [ main ]
  schedule:
    # 每天北京时间上午 8:00 运行 (UTC 时间 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason for manual run'
        required: false
        default: 'Manual trigger'
        type: string

env:
  TZ: Asia/Shanghai

# 防止并发运行互相冲突
concurrency:
  group: auto-update-rules
  cancel-in-progress: true

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 检出仓库代码
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      # 安装 Python 依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 1. 获取 Mihomo 最新版本号
      - name: Get Mihomo Version
        id: get-version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "v1.18.10")
          if [ -z "$VERSION" ]; then VERSION="v1.18.10"; fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # 2. 缓存 Mihomo 可执行文件（已升级至 v5 适配 Node.js 24）
      - name: Cache Mihomo CLI
        id: cache-mihomo
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/mihomo
          key: mihomo-bin-${{ steps.get-version.outputs.version }}

      # 3. 安装 Mihomo CLI（无缓存时执行）
      - name: Setup Mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          echo "Downloading Mihomo Version: ${VERSION}"
          
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz"
          if ! curl -sSL -f "$DOWNLOAD_URL" -o mihomo.gz; then
            DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"
            curl -sSL -f "$DOWNLOAD_URL" -o mihomo.gz
          fi

          gzip -d -f mihomo.gz
          mv mihomo /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo

      # 4. 验证 Mihomo 是否就绪
      - name: Verify Mihomo
        run: |
          chmod +x /usr/local/bin/mihomo || true
          mihomo -v

      # 5. 逐个文件扫描并编译为对应的 .mrs 文件
      - name: Build Rules for Each File
        run: |
          # 运行原本的构建脚本（若存在）
          bash ./script/build-combined-rules.sh || true

          # 执行 Python 转换程序
          python3 -c "
          import os, re, subprocess

          txt_dir = 'txt'
          ip_pattern = re.compile(r'\b(?:\d{1,3}\.){3}\d{1,3}(?:/\d{1,2})?\b')
          domain_pattern = re.compile(r'^[a-zA-Z0-9][-a-zA-Z0-9.]*\.[a-zA-Z]{2,}$')

          if os.path.exists(txt_dir):
              for root, _, files in os.walk(txt_dir):
                  for file in files:
                      if file.endswith('.txt'):
                          file_path = os.path.join(root, file)
                          base_name = os.path.splitext(file)[0]
                          output_mrs = f'{base_name}.mrs'
                          
                          ips = set()
                          domains = set()

                          with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                              for line in f:
                                  line = line.strip()
                                  if not line or line.startswith('#'):
                                      continue

                                  # 判断是否包含 IP
                                  found_ips = ip_pattern.findall(line)
                                  if found_ips:
                                      for ip in found_ips:
                                          ips.add(ip if '/' in ip else ip + '/32')
                                      continue

                                  # 清理前缀并提取域名
                                  cleaned = re.sub(r'^(payload:|[-+*.\s]|DOMAIN(-SUFFIX)?,\s*)*', '', line, flags=re.I).strip(\"'\\\" \")
                                  if domain_pattern.match(cleaned):
                                      domains.add(cleaned)

                          # 优先判断：如果提取出的 IP 数量比域名多，当作 IP 规则集处理
                          if len(ips) > len(domains):
                              temp_file = f'_temp_{base_name}_ip.txt'
                              with open(temp_file, 'w', encoding='utf-8') as tf:
                                  tf.write('\n'.join(sorted(ips)) + '\n')
                              
                              print(f'正在编译 IP 规则集: {file} -> {output_mrs} ({len(ips)} 条)')
                              subprocess.run(['mihomo', 'convert-ruleset', 'ipcidr', 'text', temp_file, output_mrs], check=True)
                              os.remove(temp_file)

                          # 否则当作域名规则集处理
                          elif len(domains) > 0:
                              temp_file = f'_temp_{base_name}_domain.txt'
                              with open(temp_file, 'w', encoding='utf-8') as tf:
                                  tf.write('\n'.join(sorted(domains)) + '\n')

                              print(f'正在编译域名规则集: {file} -> {output_mrs} ({len(domains)} 条)')
                              subprocess.run(['mihomo', 'convert-ruleset', 'domain', 'text', temp_file, output_mrs], check=True)
                              os.remove(temp_file)
                          
                          else:
                              print(f'跳过文件 {file}: 未检测到有效 IP 或域名')
          "

      # 6. 检测到文件改动时自动提交并推送
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs *.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): auto convert txt files to mrs rulesets" --signoff
            git push
          fi
