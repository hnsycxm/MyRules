name: Auto Update Rules
on:
  push:
    paths:
      - 'txt/**'
    branches: [ main ]
  schedule:
    # 每天北京时间上午 8:00 运行 (UTC 时间 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason for manual run'
        required: false
        default: 'Manual trigger'
        type: string

env:
  TZ: Asia/Shanghai

# 防止并发运行互相冲突
concurrency:
  group: auto-update-rules
  cancel-in-progress: true

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout the repository
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Run build script
      - name: Build Rules
        run: |
          bash ./script/build-combined-rules.sh

      # Commit and push changes if detected
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs *.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): auto update domain rules" --signoff
            git push
          fi
