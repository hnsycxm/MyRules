name: Auto Update Rules
on:
  push:
    paths:
      - 'txt/**'
    branches: [ main ]
  schedule:
    # 每天北京时间上午 8:00 运行 (UTC 时间 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason for manual run'
        required: false
        default: 'Manual trigger'
        type: string

env:
  TZ: Asia/Shanghai
  # 暂时使用 Node.js 20（等待 Actions 发布 Node.js 24 支持版本）
  # 参考：https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      # Run build script
      - name: Built Rules
        run: |
          bash ./script/build-combined-rules.sh
      
      # Commit and push changes if detected
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs *.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): auto update domain rules" --signoff
            git push
          fi
